    <title>Table</title>
    <link rel="stylesheet" href="style.css" />

  <body>
    <table style="width: 100%; height: 100%" row = 2>
       <thead>

			<tr>
				<td>Column 1</td>
				<td>Column 2</td>
			</tr>
			
		</th>

			<td>abc</td>
			<td>def</td>	
		</tr>
    </table>
  </body>
</html>
